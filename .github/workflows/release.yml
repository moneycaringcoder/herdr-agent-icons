name: Release

# Pushing a vX.Y.Z tag runs the gates and, only if all of them pass, publishes
# the GitHub release with notes taken from that version's CHANGELOG.md section.
#
# Nothing else triggers this. A tag that fails any gate leaves no release
# behind: publication is the last step, in a separate job that depends on every
# other one, and it is the only job granted write access.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    name: release identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Prove the identity gate can refuse
        # Before trusting the gate below, run its own boundary tests. A gate
        # that passes everything is worse than no gate, because it turns an
        # unchecked release into one that looks checked.
        run: python tools/test_check_release.py

      - name: Verify the tag against every version surface
        # Refuses unless the tag and herdr-plugin.toml agree, and the changelog
        # has a dated, non-empty section for that version.
        run: python tools/check_release.py

  lint:
    name: release lint
    needs: identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install ruff
        run: python -m pip install --disable-pip-version-check -r requirements-lint.txt

      - name: Ruff
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

  test:
    name: release test (${{ matrix.os }}, python ${{ matrix.python-version }})
    needs: identity
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test
        run: python -m unittest discover -s tests -p 'test_*.py' --verbose

  font:
    name: release font
    needs: identity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the font build environment
        run: python -m pip install --disable-pip-version-check -r requirements-font.txt

      - name: Font structure and reproducibility
        run: python -m unittest tests.test_font --verbose

      # dist/ carries a committed binary that users install. Publishing a
      # release whose tagged tree disagrees with a fresh build would ship a
      # typeface nobody produced from the sources in that tag.
      - name: Confirm the committed font is unchanged by a rebuild
        run: |
          python tools/build_font.py
          git diff --exit-code -- dist/

  publish:
    name: publish the GitHub release
    needs: [identity, lint, test, font]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Re-verify identity and collect the release notes
        # Deliberately run again rather than carrying the notes from the
        # identity job as an artifact. It is a few seconds, it removes an
        # artifact that could be substituted between jobs, and it means the
        # notes are produced by the same checkout that is about to be
        # published from.
        run: python tools/check_release.py --notes-out "$RUNNER_TEMP/notes.md"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "refusing to publish from tag $TAG" >&2
            exit 1
          fi
          # --verify-tag refuses if the tag does not exist on the remote, so a
          # deleted or rewritten tag cannot produce a release pointing nowhere.
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag \
            dist/HerdrHarnessLogos-Regular.ttf

      - name: Record what was published
        if: always()
        env:
          TAG: ${{ github.ref_name }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -uo pipefail
          {
            echo "## Release ${TAG}"
            echo
            echo "- Result: \`${JOB_STATUS}\`"
            echo
            echo "### Notes published"
            echo
            cat "$RUNNER_TEMP/notes.md" 2>/dev/null || echo "_none: the identity gate refused._"
          } >> "$GITHUB_STEP_SUMMARY"
